ow( 1px 2px 2px rgba(185,185,185,1));}#dad601387ae [data-look="neo"].node circle .state-start{fill:#000000;}#dad601387ae [data-look="neo"].icon-shape .icon{fill:url(#dad601387ae-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#dad601387ae [data-look="neo"].icon-shape .icon-neo path{stroke:url(#dad601387ae-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#dad601387ae :root{--mermaid-font-family:"Noto Sans JP","Noto Sans CJK JP",sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="271.5" y="28" width="243.5" height="163.5" fill="#f5f7fa"></rect><text x="0" y="0" fill="#292a2e" font-size="15" dominant-baseline="middle" text-anchor="middle" transform="translate(393.25, 109.75) rotate(0)">長期計画が必要</text></g><g class="quadrant"><rect x="28" y="28" width="243.5" height="163.5" fill="#e9f2fe"></rect><text x="0" y="0" fill="#292a2e" font-size="15" dominant-baseline="middle" text-anchor="middle" transform="translate(149.75, 109.75) rotate(0)">優先度が高い</text></g><g class="quadrant"><rect x="28" y="191.5" width="243.5" height="163.5" fill="#ffffff"></rect><text x="0" y="0" fill="#292a2e" font-size="15" dominant-baseline="middle" text-anchor="middle" transform="translate(149.75, 273.25) rotate(0)">優先度低め</text></g><g class="quadrant"><rect x="271.5" y="191.5" width="243.5" height="163.5" fill="#f5f7fa"></rect><text x="0" y="0" fill="#292a2e" font-size="15" dominant-baseline="middle" text-anchor="middle" transform="translate(393.25, 273.25) rotate(0)">価値が低い</text></g></g><g class="border"><line x1="27" y1="28" x2="516" y2="28" style="stroke: rgb(255, 255, 255); stroke-width: 2;"></line><line x1="515" y1="29" x2="515" y2="354" style="stroke: rgb(255, 255, 255); stroke-width: 2;"></line><line x1="27" y1="355" x2="516" y2="355" style="stroke: rgb(255, 255, 255); stroke-width: 2;"></line><line x1="28" y1="29" x2="28" y2="354" style="stroke: rgb(255, 255, 255); stroke-width: 2;"></line><line x1="271.5" y1="29" x2="271.